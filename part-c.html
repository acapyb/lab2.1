
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Exercise 2.1</title>
</head>
<body>

    <h1>Chapter 2 Lab Exercise 2.1
        HTML Elements with Attributes</h1>

    <!-- Attribute 1: id -->
    <h2 id="introduction">Introduction</h2>
    <p>This element has a unique ID.</p>

    <!-- Attribute 2: class -->
    <p class="description">First paragraph with class.</p>
    <p class="description">Second paragraph with class.</p>

    <!-- Attribute 3: href -->
    <a href="https://www.google.com">
        Visit Google
    </a>

    <br><br>

    <!-- Attribute 4: src -->
    <img src="images/autumn.jpg"
         width="200" alt="Example photograph">

    <br><br>

    <!-- Attribute 5: alt -->
    <img src="images/picture.jpg"
         alt="My personal photograph"
         width="200">

    <br><br>

    <!-- Attribute 6: title -->
    <p title="This is additional information">
        Hover your mouse over this paragraph.
    </p>

    <!-- Attribute 7: style -->
    <p style="color: blue; font-size: 20px;">
        This paragraph uses the style attribute.
    </p>

    <!-- Attribute 8: disabled -->
    <input type="text"
           placeholder="Disabled input"
           disabled>

    <br><br>

    <!-- Attribute 9: value -->
    <input type="text"
           value="Hello HTML">

    <br><br>

    <!-- Attribute 10: checked -->
    <input type="checkbox"
           id="agree"
           checked>
    <label for="agree">I agree</label>

</body>
</html>
